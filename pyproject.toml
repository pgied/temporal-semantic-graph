[project]
name = "temporal-semantic-graph"
version = "0.1.0"
description = "Temporal semantic graphs: encode documents, map them to a graph over time (Mapper), visualize it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.8",
    "matplotlib>=3.10.9",
    "networkx>=3.4",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=6.3.0",
    "torch>=2.9.1",
]

[[tool.uv.index]]
name = "pytorch-cuda-win"
url = "https://download.pytorch.org/whl/cu126"
explicit = true # Ensures uv only uses this index when specifically told to

[tool.uv.sources]
# Use the cu126 index ONLY on Windows. 
# Mac and Linux will automatically fall back to the standard PyPI index.
torch = [
    { index = "pytorch-cuda-win", marker = "sys_platform == 'win32'" }
]
